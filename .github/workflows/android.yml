name: JULIET Android APK Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build JULIET APK
runs-on: ubuntu-22.04
timeout-minutes: 60

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find or Install Android SDK Manager
    id: sdk
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p "$ANDROID_HOME/cmdline-tools"

      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
        -type f -name sdkmanager 2>/dev/null \
        | sort -V | tail -n 1 || true)"

      if [ -z "$SDKMANAGER" ]; then
        echo "Installing Android command-line tools..."

        cd "$RUNNER_TEMP"

        curl -fL --retry 3 \
          "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
          -o android-cli.zip

        mkdir -p android-cli-extracted
        unzip -q android-cli.zip -d android-cli-extracted

        mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

        cp -a android-cli-extracted/cmdline-tools/. \
          "$ANDROID_HOME/cmdline-tools/latest/"

        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      fi

      if [ ! -f "$SDKMANAGER" ]; then
        echo "::error::Android SDK Manager was not found."
        exit 1
      fi

      chmod +x "$SDKMANAGER"

      echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

  - name: Accept Android SDK Licenses
    shell: bash
    env:
      SDKMANAGER: ${{ steps.sdk.outputs.manager }}
    run: |
      set -euo pipefail

      yes | "$SDKMANAGER" \
        --sdk_root="$ANDROID_HOME" \
        --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1 || true

      cat "$RUNNER_TEMP/sdk-licenses.log"

  - name: Install Android SDK 34
    shell: bash
    env:
      SDKMANAGER: ${{ steps.sdk.outputs.manager }}
    run: |
      set -euo pipefail

      "$SDKMANAGER" \
        --sdk_root="$ANDROID_HOME" \
        --install \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"

  - name: Extract and Locate Android Project
    id: project
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$GITHUB_WORKSPACE/JULIET-AI.zip"
      PROJECT_DIR="$GITHUB_WORKSPACE/unpacked-juliet"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "::error::JULIET-AI.zip was not found in the repository root."
        echo "ZIP files available:"
        find "$GITHUB_WORKSPACE" -maxdepth 4 \
          -type f -iname '*.zip' -print
        exit 1
      fi

      echo "Validating source ZIP..."
      unzip -t "$ZIP_FILE"

      rm -rf "$PROJECT_DIR"
      mkdir -p "$PROJECT_DIR"

      echo "Extracting source ZIP..."
      unzip -oq "$ZIP_FILE" -d "$PROJECT_DIR"

      SETTINGS_FILE="$(find "$PROJECT_DIR" \
        -type f \
        \( -name settings.gradle \
        -o -name settings.gradle.kts \) \
        -not -path '*/.gradle/*' \
        -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "::error::No Gradle settings file found inside JULIET-AI.zip."
        find "$PROJECT_DIR" -maxdepth 5 -type f | head -200
        exit 1
      fi

      ROOT="$(dirname "$SETTINGS_FILE")"

      if [ ! -f "$ROOT/build.gradle.kts" ] && \
         [ ! -f "$ROOT/build.gradle" ]; then
        echo "::error::Project-level Gradle build file is missing."
        exit 1
      fi

      if [ ! -f "$ROOT/app/build.gradle.kts" ] && \
         [ ! -f "$ROOT/app/build.gradle" ]; then
        echo "::error::Android app Gradle file is missing."
        exit 1
      fi

      echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      echo "Android project found at: $ROOT"
      ls -la "$ROOT"

  - name: Prepare Gradle 8.7
    shell: bash
    run: |
      set -euo pipefail

      if ! command -v gradle >/dev/null 2>&1; then
        cd "$RUNNER_TEMP"

        curl -fL --retry 3 \
          "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
          -o gradle-8.7-bin.zip

        unzip -oq gradle-8.7-bin.zip -d "$RUNNER_TEMP/gradle-dist"

        echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" \
          >> "$GITHUB_PATH"
      fi

  - name: Build Debug APK
    id: build
    shell: bash
    env:
      PROJECT_ROOT: ${{ steps.project.outputs.root }}
    run: |
      set -uo pipefail

      LOG_FILE="$RUNNER_TEMP/build.log"

      echo "Java version:"
      java -version

      echo "Gradle version:"
      gradle --version

      set +e

      gradle \
        -p "$PROJECT_ROOT" \
        assembleDebug \
        --no-daemon \
        --stacktrace 2>&1 | tee "$LOG_FILE"

      BUILD_STATUS=${PIPESTATUS[0]}

      set -e

      if [ "$BUILD_STATUS" -ne 0 ]; then
        echo "::error::Gradle build failed. Download the build log artifact."
        exit "$BUILD_STATUS"
      fi

      echo "APK build completed."

  - name: Upload Debug APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JULIET-AI-Debug-APK
      path: unpacked-juliet/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7

  - name: Upload Build Log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: JULIET-AI-Build-Log
      path: ${{ runner.temp }}/build.log
      if-no-files-found: ignore
      retention-days: 7
