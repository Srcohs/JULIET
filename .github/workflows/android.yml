
name: JULIET AI - Complete Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juliet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Verify and Package JULIET AI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
      ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home

    steps:
      # 1. Download repository source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Configure Java without Gradle cache auto-detection
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Initialize diagnostic logs
      - name: Initialize build diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/juliet-diagnostics"
          {
            echo "JULIET AI Android Build Diagnostics"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Started: $(date -u)"
          } | tee "$RUNNER_TEMP/juliet-diagnostics/environment.txt"

      # 5. Inspect repository and find project
      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Root directory contents:"
          ls -la

          echo "Searching for Gradle project files..."

          find . -maxdepth 6 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -not -path "./.git/*" \
            -print | tee "$RUNNER_TEMP/juliet-diagnostics/gradle-files.txt"

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          else
            while IFS= read -r FILE; do
              CANDIDATE="$(dirname "$FILE")"

              if [ -f "$CANDIDATE/app/build.gradle.kts" ] || \
                 [ -f "$CANDIDATE/app/build.gradle" ]; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            done < <(
              find . -maxdepth 6 -type f \
                \( -name "settings.gradle" \
                -o -name "settings.gradle.kts" \) \
                -not -path "./.git/*" | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android Gradle project found."
            echo "Ensure settings.gradle(.kts), build.gradle(.kts), and the app module are committed to GitHub."
            exit 1
          fi

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$GITHUB_WORKSPACE/${PROJECT_DIR#./}"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The app module Gradle file is missing."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected project: $PROJECT_DIR"

          {
            echo "Project directory: $PROJECT_DIR"
            echo ""
            echo "Project files:"
            find "$PROJECT_DIR" -maxdepth 3 -type f \
              -not -path "*/.git/*" | sort | head -n 250
          } > "$RUNNER_TEMP/juliet-diagnostics/project-files.txt"

      # 6. Install common Android SDK platforms and build tools
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            > "$RUNNER_TEMP/juliet-diagnostics/sdk-licenses.log" 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            2>&1 | tee "$RUNNER_TEMP/juliet-diagnostics/sdk-install.log"

          sdkmanager --list_installed \
            > "$RUNNER_TEMP/juliet-diagnostics/sdk-installed.txt"

      # 7. Install a known Gradle version for projects without a working wrapper
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # 8. Verify build environment and wrapper
      - name: Verify build environment
        id: environment
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -euo pipefail

          java -version 2>&1 | tee "$RUNNER_TEMP/juliet-diagnostics/java.txt"
          gradle --version 2>&1 | tee "$RUNNER_TEMP/juliet-diagnostics/gradle.txt"

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties \
              | tee "$RUNNER_TEMP/juliet-diagnostics/wrapper-properties.txt"
          else
            echo "Gradle wrapper properties not found; system Gradle will be used." \
              | tee "$RUNNER_TEMP/juliet-diagnostics/wrapper-properties.txt"
          fi

          if [ -f gradlew ] && \
             [ -f gradle/wrapper/gradle-wrapper.jar ] && \
             [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x gradlew
            echo "gradle_command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Using project Gradle wrapper."
          else
            echo "gradle_command=gradle" >> "$GITHUB_OUTPUT"
            echo "Using installed Gradle 8.7."
          fi

      # 9. Build debug APK and preserve complete console output
      - name: Build JULIET debug APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          GRADLE_COMMAND: ${{ steps.environment.outputs.gradle_command }}
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/juliet-diagnostics/build.log"
          mkdir -p "$RUNNER_TEMP/juliet-apk"

          cd "$PROJECT_DIR"

          set +e
          "$GRADLE_COMMAND" \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            --info 2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}
          set -e

          echo "gradle_exit_code=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            {
              echo "## JULIET AI Gradle Build Failed"
              echo ""
              echo "Gradle exit code: $STATUS"
              echo ""
              echo '```text'
              tail -n 200 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build succeeded but the debug APK was not found."
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          cp "$APK_FILE" \
            "$RUNNER_TEMP/juliet-apk/JULIET-AI-debug.apk"

          echo "build_status=success" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_FILE"

      # 10. Verify the APK file
      - name: Verify APK
        id: verify
        if: steps.build.outputs.build_status == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/juliet-apk/JULIET-AI-debug.apk"

          test -s "$APK"
          file "$APK" | tee "$RUNNER_TEMP/juliet-diagnostics/apk-file.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/juliet-diagnostics/apk-sha256.txt"

          if ! unzip -t "$APK" \
            > "$RUNNER_TEMP/juliet-diagnostics/apk-integrity.txt" 2>&1; then
            cat "$RUNNER_TEMP/juliet-diagnostics/apk-integrity.txt"
            echo "::error::APK archive integrity check failed."
            exit 1
          fi

          echo "APK integrity verified."
          ls -lh "$APK"

      # 11. Upload APK only after a successful build and verification
      - name: Upload verified JULIET APK
        if: steps.build.outputs.build_status == 'success' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Debug-APK
          path: ${{ runner.temp }}/juliet-apk/JULIET-AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Always upload logs, including on failure
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Build-Diagnostics
          path: ${{ runner.temp }}/juliet-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # 13. Final workflow status
      - name: Final build report
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build.outputs.build_status }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## JULIET AI Build Report"
            echo ""
            echo "- Build status: ${BUILD_STATUS:-not-completed}"
            echo "- APK verification: ${VERIFY_OUTCOME:-not-run}"
            echo "- Commit: $GITHUB_SHA"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUILD_STATUS" != "success" ] || \
             [ "$VERIFY_OUTCOME" != "success" ]; then
            echo "::error::JULIET AI build or APK verification failed. Download JULIET-AI-Build-Diagnostics."
            exit 1
          fi

          echo "JULIET AI APK built and verified successfully."
