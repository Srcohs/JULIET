name: JULIET Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JULIET APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$RUNNER_TEMP"

            curl -fL --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o android-cli.zip

            mkdir -p android-cli-extracted
            unzip -q android-cli.zip -d android-cli-extracted

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a android-cli-extracted/cmdline-tools/. \
              "$ANDROID_HOME/cmdline-tools/latest/"

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK Licenses
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android SDK Packages
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract and Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/JULIET-AI.zip"
          EXTRACT_DIR="$RUNNER_TEMP/juliet-project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::JULIET-AI.zip not found in repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found inside JULIET-AI.zip."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_ROOT/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "::error::Project-level Gradle build file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle or app/build.gradle.kts is missing."
            exit 1
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_ROOT"

      - name: Build Debug APK
        id: build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -uo pipefail

          LOG_FILE="$RUNNER_TEMP/build.log"

          set +e
          gradle \
            -p "$PROJECT_ROOT" \
            assembleDebug \
            --no-daemon \
            --stacktrace 2>&1 | tee "$LOG_FILE"

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Gradle build failed. Check the build log artifact."
            exit "$BUILD_STATUS"
          fi

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Debug-APK
          path: ${{ runner.temp }}/juliet-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
